plugins {
  id 'java'
}

group = 'horizonSimple.electrical.core'
version = 'unspecified'

repositories {
  mavenCentral()
}

dependencies {
  testImplementation platform('org.junit:junit-bom:5.10.0')
  testImplementation 'org.junit.jupiter:junit-jupiter'

  api "com.badlogicgames.gdx:gdx:$gdxVersion"
}

test {
  useJUnitPlatform()
}
